# Rule bases from outside the house. Tom, 7 Oct 2026: "I want a rule base
# added to whatever lint you need that normalizes language. It doesn't have
# to be mine or yours, it just needs to work."
#
# Google developer documentation style guide is the base: it was written for
# technical prose like this book. proselint and write-good add the general
# usage rules. Microsoft's guide duplicates Google's, so it stays synced but
# off. Rules switched off below conflict with a house rule Tom set, and
# each says which.
StylesPath = styles
MinAlertLevel = suggestion
Vocab = Lab
Packages = Google, Microsoft, proselint, write-good

[*.md]
BasedOnStyles = Vale, Google, proselint, write-good

# Quotations belong to their sources; never flag a source's words.
TokenIgnores = ("[^"\n]+"), (“[^”\n]+”)

# House style omits the serial comma ("web services, create catalogs and take payments").
Google.OxfordComma = NO
# A book has chapters; Google's rule is for web pages.
Google.WordListCase = NO
# The author speaks in the first person where the story is his.
Google.FirstPerson = NO
# "So" opens a sentence in his expository form on purpose.
write-good.So = NO
# Google.Passive already reports passive voice; one report is enough.
write-good.Passive = NO
# stack-lint judges length by the ideas in a sentence, not a word count.
Google.Headings = suggestion
# first-use-lint already checks that a term gets explained where the reader
# first sees it; Google's acronym rule repeats on every later use.
Google.Acronyms = NO
